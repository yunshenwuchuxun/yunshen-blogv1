  <polygon points="872,371 882,377 872,383" fill="#22C55E"/>
  <rect x="888" y="362" width="200" height="30" rx="8" fill="#DCFCE7"/>
  <text x="900" y="382" fill="#15803D" font-size="12" font-family="Segoe UI, Arial, sans-serif" font-weight="700">结果回给运行中的代码</text>

  <rect x="652" y="398" width="196" height="30" rx="8" fill="white" stroke="#BBF7D0" stroke-width="1.5"/>
  <text x="668" y="418" fill="#15803D" font-size="12" font-family="Consolas, monospace">脚本调用：查库存</text>
