  <text x="634" y="580" fill="#15803D" font-size="13" font-family="Segoe UI, Arial, sans-serif" font-weight="700">token 开销随「最终输出」增长，而不是随调用次数增长。</text>
  <text x="634" y="604" fill="#166534" font-size="13" font-family="Segoe UI, Arial, sans-serif">代价：不兼容 strict 模式、强制 tool_choice 和 MCP 工具。</text>
