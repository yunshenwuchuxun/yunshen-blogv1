  <text x="112" y="542" fill="#991B1B" font-size="13" font-family="Segoe UI, Arial, sans-serif">· 3 份完整的中间结果永久占着上下文</text>
  <text x="112" y="566" fill="#991B1B" font-size="13" font-family="Segoe UI, Arial, sans-serif">· 其中绝大部分字段之后再也用不到</text>
  <text x="112" y="590" fill="#B91C1C" font-size="13" font-family="Segoe UI, Arial, sans-serif" font-weight="700">· 延迟与 token 都随调用次数线性增长</text>

  <rect x="610" y="152" width="520" height="470" rx="18" fill="#F0FDF4" stroke="#86EFAC" stroke-width="2"/>
  <text x="634" y="186" fill="#15803D" font-size="19" font-family="Segoe UI, Arial, sans-serif" font-weight="700">程序化工具调用：一次往返</text>

