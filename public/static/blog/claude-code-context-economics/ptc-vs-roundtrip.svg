  <rect x="888" y="398" width="200" height="30" rx="8" fill="#DCFCE7"/>
  <text x="900" y="418" fill="#15803D" font-size="12" font-family="Segoe UI, Arial, sans-serif" font-weight="700">结果回给运行中的代码</text>

  <text x="652" y="452" fill="#166534" font-size="13" font-family="Segoe UI, Arial, sans-serif" font-weight="700">脚本用普通控制流筛选、聚合、拼装 —— 模型看不到这些中间态</text>

  <path d="M870 476 L 870 492" stroke="#15803D" stroke-width="2"/>
