<svg width="1200" height="620" viewBox="0 0 1200 620" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="620" rx="28" fill="#F8FAFC"/>
  <rect x="32" y="32" width="1136" height="556" rx="24" fill="white" stroke="#E2E8F0" stroke-width="2"/>

  <text x="70" y="92" fill="#0F172A" font-size="30" font-family="Segoe UI, Arial, sans-serif" font-weight="700">工具层：不该进来的，一开始就别让它进来</text>
  <text x="70" y="126" fill="#475569" font-size="17" font-family="Segoe UI, Arial, sans-serif">这一层最便宜 —— 它不需要动任何已经缓存好的内容</text>

  <rect x="70" y="152" width="340" height="416" rx="18" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
  <text x="92" y="184" fill="#0F172A" font-size="17" font-family="Segoe UI, Arial, sans-serif" font-weight="700">一、超长输出落盘</text>

  <rect x="92" y="200" width="296" height="106" rx="12" fill="#FEF2F2" stroke="#FCA5A5" stroke-width="2"/>
  <text x="110" y="224" fill="#B91C1C" font-size="13" font-family="Segoe UI, Arial, sans-serif" font-weight="700">✗ 全文进上下文</text>
  <rect x="110" y="234" width="260" height="26" rx="7" fill="white"/>
  <text x="122" y="252" fill="#B91C1C" font-size="11" font-family="Consolas, monospace">tool_result: 120000 字符</text>
  <text x="110" y="278" fill="#991B1B" font-size="12" font-family="Segoe UI, Arial, sans-serif">约 3 万 token 一次性占掉，</text>
  <text x="110" y="298" fill="#991B1B" font-size="12" font-family="Segoe UI, Arial, sans-serif">而且之后一直留着。</text>

  <path d="M240 312 L 240 330" stroke="#94A3B8" stroke-width="2"/>
  <polygon points="234,330 240,340 246,330" fill="#94A3B8"/>

  <rect x="92" y="346" width="296" height="106" rx="12" fill="#F0FDF4" stroke="#86EFAC" stroke-width="2"/>
  <text x="110" y="370" fill="#15803D" font-size="13" font-family="Segoe UI, Arial, sans-serif" font-weight="700">✓ 截断预览 + 文件路径</text>
  <rect x="110" y="380" width="260" height="26" rx="7" fill="white"/>
  <text x="122" y="398" fill="#15803D" font-size="11" font-family="Consolas, monospace">预览… 全文见 /tmp/out.txt</text>
  <text x="110" y="424" fill="#166534" font-size="12" font-family="Segoe UI, Arial, sans-serif">模型真需要细节时，再自己</text>
  <text x="110" y="444" fill="#166534" font-size="12" font-family="Segoe UI, Arial, sans-serif">去读那个文件。</text>

  <text x="92" y="486" fill="#B45309" font-size="12" font-family="Segoe UI, Arial, sans-serif" font-weight="700">注意：阈值按字符算，不按 token。</text>
  <text x="92" y="510" fill="#92400E" font-size="12" font-family="Segoe UI, Arial, sans-serif">中文和代码的字符/token 比例</text>
  <text x="92" y="530" fill="#92400E" font-size="12" font-family="Segoe UI, Arial, sans-serif">差别很大，别按 token 估算</text>
  <text x="92" y="550" fill="#92400E" font-size="12" font-family="Segoe UI, Arial, sans-serif">什么时候会被截断。</text>

  <rect x="430" y="152" width="340" height="416" rx="18" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
  <text x="452" y="184" fill="#0F172A" font-size="17" font-family="Segoe UI, Arial, sans-serif" font-weight="700">二、分页而非整读</text>

  <rect x="452" y="200" width="296" height="106" rx="12" fill="#FEF2F2" stroke="#FCA5A5" stroke-width="2"/>
  <text x="470" y="224" fill="#B91C1C" font-size="13" font-family="Segoe UI, Arial, sans-serif" font-weight="700">✗ 整个文件读进来</text>
  <rect x="470" y="234" width="260" height="26" rx="7" fill="white"/>
  <text x="482" y="252" fill="#B91C1C" font-size="11" font-family="Consolas, monospace">Read("app/page.tsx")</text>
  <text x="470" y="278" fill="#991B1B" font-size="12" font-family="Segoe UI, Arial, sans-serif">为了改第 12 行，把 3000 行</text>
  <text x="470" y="298" fill="#991B1B" font-size="12" font-family="Segoe UI, Arial, sans-serif">全塞进了上下文。</text>

  <path d="M600 312 L 600 330" stroke="#94A3B8" stroke-width="2"/>
  <polygon points="594,330 600,340 606,330" fill="#94A3B8"/>

  <rect x="452" y="346" width="296" height="106" rx="12" fill="#F0FDF4" stroke="#86EFAC" stroke-width="2"/>
  <text x="470" y="370" fill="#15803D" font-size="13" font-family="Segoe UI, Arial, sans-serif" font-weight="700">✓ 只取需要的那一段</text>
  <rect x="470" y="380" width="260" height="26" rx="7" fill="white"/>
  <text x="482" y="398" fill="#15803D" font-size="11" font-family="Consolas, monospace">Read(offset=1, limit=50)</text>
  <text x="470" y="424" fill="#166534" font-size="12" font-family="Segoe UI, Arial, sans-serif">已经知道位置的时候，没有</text>
  <text x="470" y="444" fill="#166534" font-size="12" font-family="Segoe UI, Arial, sans-serif">理由把整份都拉过来。</text>

  <text x="452" y="486" fill="#B45309" font-size="12" font-family="Segoe UI, Arial, sans-serif" font-weight="700">还有一条反直觉的省法：</text>
  <text x="452" y="510" fill="#92400E" font-size="12" font-family="Segoe UI, Arial, sans-serif">改完文件不要回读验证。</text>
  <text x="452" y="530" fill="#92400E" font-size="12" font-family="Segoe UI, Arial, sans-serif">写入失败本来就会报错，</text>
  <text x="452" y="550" fill="#92400E" font-size="12" font-family="Segoe UI, Arial, sans-serif">回读只是白花一份文件。</text>

  <rect x="790" y="152" width="340" height="416" rx="18" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
  <text x="812" y="184" fill="#0F172A" font-size="17" font-family="Segoe UI, Arial, sans-serif" font-weight="700">三、查询代替搬运</text>

  <rect x="812" y="200" width="296" height="106" rx="12" fill="#FEF2F2" stroke="#FCA5A5" stroke-width="2"/>
  <text x="830" y="224" fill="#B91C1C" font-size="13" font-family="Segoe UI, Arial, sans-serif" font-weight="700">✗ 全量拉回来自己找</text>
  <rect x="830" y="234" width="260" height="26" rx="7" fill="white"/>
  <text x="842" y="252" fill="#B91C1C" font-size="11" font-family="Consolas, monospace">cat *.mdx</text>
  <text x="830" y="278" fill="#991B1B" font-size="12" font-family="Segoe UI, Arial, sans-serif">让模型在几万行里数数，</text>
  <text x="830" y="298" fill="#991B1B" font-size="12" font-family="Segoe UI, Arial, sans-serif">既贵又容易数错。</text>

  <path d="M960 312 L 960 330" stroke="#94A3B8" stroke-width="2"/>
  <polygon points="954,330 960,340 966,330" fill="#94A3B8"/>

  <rect x="812" y="346" width="296" height="106" rx="12" fill="#F0FDF4" stroke="#86EFAC" stroke-width="2"/>
  <text x="830" y="370" fill="#15803D" font-size="13" font-family="Segoe UI, Arial, sans-serif" font-weight="700">✓ 让 shell 先算好</text>
  <rect x="830" y="380" width="260" height="26" rx="7" fill="white"/>
  <text x="842" y="398" fill="#15803D" font-size="11" font-family="Consolas, monospace">grep -c … | sort | head -20</text>
  <text x="830" y="424" fill="#166534" font-size="12" font-family="Segoe UI, Arial, sans-serif">回到上下文的只是一张已经</text>
  <text x="830" y="444" fill="#166534" font-size="12" font-family="Segoe UI, Arial, sans-serif">聚合好的小表。</text>

  <text x="812" y="486" fill="#15803D" font-size="12" font-family="Segoe UI, Arial, sans-serif" font-weight="700">确定性的计算交给代码，</text>
  <text x="812" y="510" fill="#166534" font-size="12" font-family="Segoe UI, Arial, sans-serif">判断留给模型 —— 这条同时</text>
  <text x="812" y="530" fill="#166534" font-size="12" font-family="Segoe UI, Arial, sans-serif">省 token 又提高准确率，</text>
  <text x="812" y="550" fill="#166534" font-size="12" font-family="Segoe UI, Arial, sans-serif">是性价比最高的一招。</text>
</svg>
