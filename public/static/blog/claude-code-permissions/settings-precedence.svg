<svg width="1200" height="640" viewBox="0 0 1200 640" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="640" rx="28" fill="#F8FAFC"/>
  <rect x="32" y="32" width="1136" height="576" rx="24" fill="white" stroke="#E2E8F0" stroke-width="2"/>

  <text x="70" y="92" fill="#0F172A" font-size="30" font-family="Segoe UI, Arial, sans-serif" font-weight="700">settings 的四层继承，以及两个静默陷阱</text>
  <text x="70" y="126" fill="#475569" font-size="17" font-family="Segoe UI, Arial, sans-serif">和记忆那套不同：这里的层级是真的优先级覆盖，不是拼接</text>

  <text x="110" y="184" fill="#0F172A" font-size="17" font-family="Segoe UI, Arial, sans-serif" font-weight="700">优先级从高到低</text>

  <path d="M88 546 L 88 206" stroke="#7C3AED" stroke-width="2.5"/>
  <polygon points="82,206 88,194 94,206" fill="#7C3AED"/>

  <rect x="110" y="200" width="420" height="76" rx="12" fill="#EDE9FE" stroke="#8B5CF6" stroke-width="2.5"/>
  <text x="132" y="226" fill="#7C3AED" font-size="16" font-family="Segoe UI, Arial, sans-serif" font-weight="700">managed policy</text>
  <text x="132" y="248" fill="#6D28D9" font-size="12" font-family="Segoe UI, Arial, sans-serif">由 IT 通过 MDM / 组策略下发，个人设置无法覆盖</text>
  <text x="132" y="268" fill="#6D28D9" font-size="12" font-family="Consolas, monospace">managed-settings.json</text>

  <rect x="110" y="290" width="420" height="76" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="2"/>
  <text x="132" y="316" fill="#1D4ED8" font-size="16" font-family="Segoe UI, Arial, sans-serif" font-weight="700">user</text>
  <text x="132" y="338" fill="#1E40AF" font-size="12" font-family="Segoe UI, Arial, sans-serif">你自己的全局偏好，跨所有项目生效</text>
  <text x="132" y="358" fill="#1E40AF" font-size="12" font-family="Consolas, monospace">~/.claude/settings.json</text>

  <rect x="110" y="380" width="420" height="76" rx="12" fill="#DCFCE7" stroke="#86EFAC" stroke-width="2"/>
  <text x="132" y="406" fill="#15803D" font-size="16" font-family="Segoe UI, Arial, sans-serif" font-weight="700">project</text>
  <text x="132" y="428" fill="#166534" font-size="12" font-family="Segoe UI, Arial, sans-serif">随仓库走，团队共享 —— 所以要过信任门</text>
  <text x="132" y="448" fill="#166534" font-size="12" font-family="Consolas, monospace">.claude/settings.json</text>

  <rect x="110" y="470" width="420" height="76" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="2"/>
  <text x="132" y="496" fill="#B45309" font-size="16" font-family="Segoe UI, Arial, sans-serif" font-weight="700">local</text>
  <text x="132" y="518" fill="#92400E" font-size="12" font-family="Segoe UI, Arial, sans-serif">只在你本机的这个项目里生效，应加进 gitignore</text>
  <text x="132" y="538" fill="#92400E" font-size="12" font-family="Consolas, monospace">.claude/settings.local.json</text>

  <rect x="560" y="176" width="570" height="184" rx="16" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="2"/>
  <text x="584" y="208" fill="#1D4ED8" font-size="17" font-family="Segoe UI, Arial, sans-serif" font-weight="700">陷阱一：数组合并，标量覆盖</text>
  <text x="584" y="238" fill="#1E40AF" font-size="13" font-family="Segoe UI, Arial, sans-serif">同一个键在两层都写了，结果取决于它的类型：</text>
  <rect x="584" y="252" width="240" height="30" rx="8" fill="white"/>
  <text x="598" y="272" fill="#1D4ED8" font-size="12" font-family="Segoe UI, Arial, sans-serif" font-weight="700">数组类：跨层合并，不是覆盖</text>
  <rect x="836" y="252" width="270" height="30" rx="8" fill="white"/>
  <text x="850" y="272" fill="#1D4ED8" font-size="12" font-family="Segoe UI, Arial, sans-serif" font-weight="700">标量类：高优先级层直接覆盖</text>
  <text x="584" y="308" fill="#1E40AF" font-size="13" font-family="Segoe UI, Arial, sans-serif">所以想「取消」上层加的某条排除规则，往往做不到 ——</text>
  <text x="584" y="330" fill="#B91C1C" font-size="13" font-family="Segoe UI, Arial, sans-serif" font-weight="700">数组只会越加越长，没有「减法」语义。</text>

  <rect x="560" y="376" width="570" height="184" rx="16" fill="#FEF2F2" stroke="#FCA5A5" stroke-width="2"/>
  <text x="584" y="408" fill="#B91C1C" font-size="17" font-family="Segoe UI, Arial, sans-serif" font-weight="700">陷阱二：有些键只在 managed 层认</text>
  <text x="584" y="438" fill="#991B1B" font-size="13" font-family="Segoe UI, Arial, sans-serif">把它们写进 user / project / local，会被<tspan font-weight="700">静默忽略</tspan> ——</text>
  <text x="584" y="460" fill="#991B1B" font-size="13" font-family="Segoe UI, Arial, sans-serif">不报错、不警告，你只会觉得「配了但没用」。</text>
  <rect x="584" y="474" width="170" height="28" rx="8" fill="white"/>
  <text x="598" y="493" fill="#B91C1C" font-size="12" font-family="Consolas, monospace">claudeMd</text>
  <rect x="766" y="474" width="180" height="28" rx="8" fill="white"/>
  <text x="780" y="493" fill="#B91C1C" font-size="12" font-family="Consolas, monospace">forceLoginMethod</text>
  <rect x="958" y="474" width="148" height="28" rx="8" fill="white"/>
  <text x="972" y="493" fill="#B91C1C" font-size="12" font-family="Consolas, monospace">forceLoginOrgUUID</text>
  <text x="584" y="528" fill="#991B1B" font-size="13" font-family="Segoe UI, Arial, sans-serif">同理，managed 层下发的 CLAUDE.md 和 deny 规则，</text>
  <text x="584" y="550" fill="#B91C1C" font-size="13" font-family="Segoe UI, Arial, sans-serif" font-weight="700">个人设置一律排除不掉 —— 这正是它存在的意义。</text>

  <rect x="560" y="574" width="570" height="30" rx="8" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="584" y="594" fill="#334155" font-size="12" font-family="Segoe UI, Arial, sans-serif" font-weight="700">调试时可用 --setting-sources 显式排除 project / local，隔离出问题层。</text>
</svg>
