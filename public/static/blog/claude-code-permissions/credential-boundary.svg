<svg width="1200" height="660" viewBox="0 0 1200 660" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="660" rx="28" fill="#F8FAFC"/>
  <rect x="32" y="32" width="1136" height="596" rx="24" fill="white" stroke="#E2E8F0" stroke-width="2"/>

  <text x="70" y="92" fill="#0F172A" font-size="30" font-family="Segoe UI, Arial, sans-serif" font-weight="700">凭据层：秘密根本不进沙箱</text>
  <text x="70" y="126" fill="#475569" font-size="17" font-family="Segoe UI, Arial, sans-serif">这一层的设计目标不是「模型别乱用密钥」，而是「模型拿不到密钥」</text>

  <rect x="70" y="152" width="1060" height="212" rx="18" fill="#F5F3FF" stroke="#C4B5FD" stroke-width="2"/>
  <text x="94" y="184" fill="#7C3AED" font-size="18" font-family="Segoe UI, Arial, sans-serif" font-weight="700">真值在请求离开沙箱之后才被替换进去</text>

  <rect x="94" y="200" width="300" height="140" rx="14" fill="white" stroke="#8B5CF6" stroke-width="2" stroke-dasharray="8 5"/>
  <text x="112" y="226" fill="#7C3AED" font-size="14" font-family="Segoe UI, Arial, sans-serif" font-weight="700">沙箱内</text>
  <rect x="112" y="238" width="264" height="30" rx="8" fill="#F5F3FF"/>
  <text x="126" y="258" fill="#6D28D9" font-size="11" font-family="Consolas, monospace">echo $STRIPE_KEY</text>
  <rect x="112" y="274" width="264" height="30" rx="8" fill="#EDE9FE"/>
  <text x="126" y="294" fill="#7C3AED" font-size="11" font-family="Consolas, monospace" font-weight="700">→ &lt;一个不可用的占位符&gt;</text>
  <text x="112" y="326" fill="#B91C1C" font-size="12" font-family="Segoe UI, Arial, sans-serif" font-weight="700">沙箱里的任何代码都只能看到这个</text>

  <path d="M400 270 L 424 270" stroke="#7C3AED" stroke-width="2"/>
  <polygon points="424,264 436,270 424,276" fill="#7C3AED"/>
  <text x="398" y="256" fill="#6D28D9" font-size="11" font-family="Segoe UI, Arial, sans-serif" font-weight="700">出站</text>

  <rect x="446" y="200" width="300" height="140" rx="14" fill="#EDE9FE" stroke="#8B5CF6" stroke-width="2.5"/>
  <text x="464" y="226" fill="#7C3AED" font-size="14" font-family="Segoe UI, Arial, sans-serif" font-weight="700">出口代理（Anthropic 侧）</text>
  <text x="464" y="252" fill="#6D28D9" font-size="12" font-family="Segoe UI, Arial, sans-serif">从 vault 取出真值，替换掉占位符</text>
  <rect x="464" y="264" width="130" height="26" rx="7" fill="white"/>
  <text x="478" y="282" fill="#7C3AED" font-size="11" font-family="Segoe UI, Arial, sans-serif" font-weight="700">可注入请求头</text>
  <rect x="602" y="264" width="130" height="26" rx="7" fill="white"/>
  <text x="616" y="282" fill="#7C3AED" font-size="11" font-family="Segoe UI, Arial, sans-serif" font-weight="700">可注入请求体</text>
  <text x="464" y="312" fill="#B91C1C" font-size="12" font-family="Segoe UI, Arial, sans-serif" font-weight="700">但 URL 路径里的秘密不会被替换 ——</text>
  <text x="464" y="330" fill="#B91C1C" font-size="12" font-family="Segoe UI, Arial, sans-serif" font-weight="700">所以路径带令牌的 webhook 用不了这套</text>

  <path d="M752 270 L 776 270" stroke="#7C3AED" stroke-width="2"/>
  <polygon points="776,264 788,270 776,276" fill="#7C3AED"/>

  <rect x="798" y="200" width="308" height="140" rx="14" fill="white" stroke="#C4B5FD" stroke-width="2"/>
  <text x="816" y="226" fill="#7C3AED" font-size="14" font-family="Segoe UI, Arial, sans-serif" font-weight="700">第三方服务</text>
  <text x="816" y="252" fill="#6D28D9" font-size="12" font-family="Segoe UI, Arial, sans-serif">收到的是带真实凭据的正常请求</text>
  <text x="816" y="284" fill="#6D28D9" font-size="12" font-family="Segoe UI, Arial, sans-serif">附带效果：即使模型被提示注入攻击，</text>
  <text x="816" y="304" fill="#6D28D9" font-size="12" font-family="Segoe UI, Arial, sans-serif">它也交不出密钥 —— 因为它自己也</text>
  <text x="816" y="324" fill="#6D28D9" font-size="12" font-family="Segoe UI, Arial, sans-serif">从来没见过。</text>

  <rect x="70" y="384" width="1060" height="216" rx="18" fill="#FEF3C7" stroke="#FCD34D" stroke-width="2"/>
  <text x="94" y="416" fill="#B45309" font-size="18" font-family="Segoe UI, Arial, sans-serif" font-weight="700">但要注意：出网要过两道闸，缺一道都不通</text>
  <text x="94" y="442" fill="#92400E" font-size="13" font-family="Segoe UI, Arial, sans-serif">这是这一层最常见的误判 —— 以为配好了凭据的允许域名就能访问。</text>

  <rect x="94" y="460" width="480" height="120" rx="14" fill="white" stroke="#FCD34D" stroke-width="1.5"/>
  <text x="114" y="486" fill="#B45309" font-size="14" font-family="Segoe UI, Arial, sans-serif" font-weight="700">闸一 · 环境级 allowed_hosts</text>
  <text x="114" y="510" fill="#92400E" font-size="13" font-family="Segoe UI, Arial, sans-serif">决定「这个请求能不能出去」。</text>
  <text x="114" y="532" fill="#92400E" font-size="13" font-family="Segoe UI, Arial, sans-serif">networking 设为 limited 时默认全拒，</text>
  <text x="114" y="554" fill="#92400E" font-size="13" font-family="Segoe UI, Arial, sans-serif">要逐个列出域名。</text>
  <text x="114" y="574" fill="#B91C1C" font-size="12" font-family="Segoe UI, Arial, sans-serif" font-weight="700">漏了它：连不上，报网络错误</text>

  <rect x="602" y="460" width="504" height="120" rx="14" fill="white" stroke="#FCD34D" stroke-width="1.5"/>
  <text x="622" y="486" fill="#B45309" font-size="14" font-family="Segoe UI, Arial, sans-serif" font-weight="700">闸二 · 凭据级 allowed_hosts</text>
  <text x="622" y="510" fill="#92400E" font-size="13" font-family="Segoe UI, Arial, sans-serif">决定「这个秘密要不要注入到这个请求里」。</text>
  <text x="622" y="532" fill="#92400E" font-size="13" font-family="Segoe UI, Arial, sans-serif">范围应当尽量收窄，避免密钥被发往</text>
  <text x="622" y="554" fill="#92400E" font-size="13" font-family="Segoe UI, Arial, sans-serif">任何非预期的主机。</text>
  <text x="622" y="574" fill="#B91C1C" font-size="12" font-family="Segoe UI, Arial, sans-serif" font-weight="700">漏了它：连上了，但对方返回 401</text>
</svg>
