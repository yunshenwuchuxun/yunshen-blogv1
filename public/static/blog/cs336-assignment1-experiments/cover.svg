<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
	<title id="title">CS336 作业 1 实验复盘封面</title>
	<desc id="desc">CS336 作业 1 实验复盘：学习率、批大小、消融与 OWT。装饰性的损失曲线示意，几条曲线平稳下降，其中一条向上发散。</desc>
	<defs>
		<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
			<stop offset="0" stop-color="#0b1120" />
			<stop offset="0.5" stop-color="#0f172a" />
			<stop offset="1" stop-color="#1e293b" />
		</linearGradient>
		<linearGradient id="accentA" x1="0" y1="0" x2="1" y2="0">
			<stop offset="0" stop-color="#22d3ee" />
			<stop offset="1" stop-color="#a78bfa" />
		</linearGradient>
		<linearGradient id="accentB" x1="0" y1="0" x2="1" y2="0">
			<stop offset="0" stop-color="#f472b6" />
			<stop offset="1" stop-color="#fb923c" />
		</linearGradient>
		<filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
			<feGaussianBlur stdDeviation="5" result="blur" />
			<feMerge>
				<feMergeNode in="blur" />
				<feMergeNode in="SourceGraphic" />
			</feMerge>
		</filter>
	</defs>
	<rect width="1200" height="630" fill="url(#bg)" />

	<text x="80" y="118" fill="#7dd3fc" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="600" letter-spacing="3">CS336 · ASSIGNMENT 1</text>
	<text x="80" y="190" fill="#f8fafc" font-family="Inter, Arial, sans-serif" font-size="62" font-weight="800">作业 1 实验复盘</text>
	<text x="80" y="240" fill="#cbd5e1" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="500">学习率 · 批大小 · 消融 · OWT</text>

	<!-- 图例：收敛 / 停滞 / 发散 -->
	<g transform="translate(860,112)" font-family="Inter, Arial, sans-serif" font-size="19">
		<rect x="0" y="-2" width="44" height="4" rx="2" fill="url(#accentA)" />
		<text x="60" y="7" fill="#94a3b8">收敛</text>
		<rect x="0" y="42" width="44" height="4" rx="2" fill="#a78bfa" fill-opacity="0.75" />
		<text x="60" y="51" fill="#94a3b8">前期停滞</text>
		<rect x="0" y="86" width="44" height="4" rx="2" fill="url(#accentB)" />
		<text x="60" y="95" fill="#94a3b8">发散</text>
	</g>

	<!-- 示意性的损失曲线 -->
	<g transform="translate(80,290)">
		<rect width="1040" height="260" rx="22" fill="#0b1120" fill-opacity="0.6" stroke="#334155" />

		<!-- 网格与坐标轴 -->
		<g stroke="#1e293b" stroke-width="1.5" stroke-dasharray="6 8">
			<line x1="56" y1="80" x2="1000" y2="80" />
			<line x1="56" y1="130" x2="1000" y2="130" />
			<line x1="56" y1="180" x2="1000" y2="180" />
		</g>
		<path d="M56 30 V226 H1004" fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round" />
		<text x="70" y="44" fill="#64748b" font-family="ui-monospace, Menlo, monospace" font-size="16">loss</text>
		<text x="1004" y="250" text-anchor="end" fill="#64748b" font-family="ui-monospace, Menlo, monospace" font-size="16">steps</text>

		<!-- 学习率偏小：下降缓慢 -->
		<path d="M64 46 C 190 120, 330 150, 520 168 S 820 184, 996 188" fill="none" stroke="#818cf8" stroke-opacity="0.45" stroke-width="3" stroke-linecap="round" />
		<!-- 学习率偏大：前期停滞，学习率衰减后才下降 -->
		<path d="M64 46 C 96 78, 130 86, 220 88 S 420 92, 530 116 S 820 166, 996 176" fill="none" stroke="#a78bfa" stroke-opacity="0.75" stroke-width="3" stroke-linecap="round" />
		<!-- 次优学习率 -->
		<path d="M64 46 C 118 150, 230 170, 400 182 S 780 196, 996 200" fill="none" stroke="#38bdf8" stroke-opacity="0.55" stroke-width="3" stroke-linecap="round" />
		<!-- 最佳学习率 -->
		<path d="M64 46 C 110 162, 210 182, 380 192 S 760 206, 996 210" fill="none" stroke="url(#accentA)" stroke-width="5" stroke-linecap="round" filter="url(#glow)" />
		<!-- 发散 -->
		<path d="M64 46 C 92 104, 128 118, 168 110 S 226 64, 262 22" fill="none" stroke="url(#accentB)" stroke-width="5" stroke-linecap="round" filter="url(#glow)" />
		<g stroke="#fb923c" stroke-width="4" stroke-linecap="round">
			<line x1="254" y1="14" x2="270" y2="30" />
			<line x1="270" y1="14" x2="254" y2="30" />
		</g>
	</g>

	<rect x="80" y="582" width="60" height="6" rx="3" fill="url(#accentA)" />
	<rect x="150" y="582" width="36" height="6" rx="3" fill="url(#accentB)" />
	<text x="1120" y="600" text-anchor="end" fill="#475569" font-family="Inter, Arial, sans-serif" font-size="18">TinyStories · OpenWebText · MacBook M2 Pro</text>
</svg>
