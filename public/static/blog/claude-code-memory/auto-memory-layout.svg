<svg width="1200" height="640" viewBox="0 0 1200 640" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="640" rx="28" fill="#F8FAFC"/>
  <rect x="32" y="32" width="1136" height="576" rx="24" fill="white" stroke="#E2E8F0" stroke-width="2"/>

  <text x="70" y="92" fill="#0F172A" font-size="30" font-family="Segoe UI, Arial, sans-serif" font-weight="700">Auto Memory：索引常驻，细节按需</text>
  <text x="70" y="126" fill="#475569" font-size="17" font-family="Segoe UI, Arial, sans-serif">磁盘上可以有很多文件，但每次会话只有索引的前 200 行 / 25KB 进上下文</text>

  <rect x="70" y="158" width="330" height="430" rx="20" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
  <text x="94" y="194" fill="#0F172A" font-size="17" font-family="Segoe UI, Arial, sans-serif" font-weight="700">磁盘上的目录</text>

  <text x="94" y="230" fill="#475569" font-size="14" font-family="Consolas, monospace">~/.claude/projects/</text>
  <text x="94" y="254" fill="#475569" font-size="14" font-family="Consolas, monospace">  &lt;project&gt;/memory/</text>
  <text x="94" y="292" fill="#15803D" font-size="14" font-family="Consolas, monospace"><tspan>├── </tspan><tspan font-weight="700">MEMORY.md</tspan></text>
  <text x="94" y="322" fill="#7C3AED" font-size="14" font-family="Consolas, monospace">├── debugging.md</text>
  <text x="94" y="352" fill="#7C3AED" font-size="14" font-family="Consolas, monospace">├── api-conventions.md</text>
  <text x="94" y="382" fill="#7C3AED" font-size="14" font-family="Consolas, monospace">└── repo-topology.md</text>

  <rect x="94" y="410" width="282" height="152" rx="14" fill="#FFF7ED" stroke="#FED7AA" stroke-width="1.5"/>
  <text x="112" y="438" fill="#9A3412" font-size="14" font-family="Segoe UI, Arial, sans-serif" font-weight="700">存储键是怎么算出来的</text>
  <text x="112" y="466" fill="#7C2D12" font-size="13" font-family="Segoe UI, Arial, sans-serif">&lt;project&gt; 由 git repo 派生，</text>
  <text x="112" y="488" fill="#7C2D12" font-size="13" font-family="Segoe UI, Arial, sans-serif">所以同一仓库的所有 worktree</text>
  <text x="112" y="510" fill="#7C2D12" font-size="13" font-family="Segoe UI, Arial, sans-serif">和子目录共享同一份记忆。</text>
  <text x="112" y="540" fill="#B91C1C" font-size="13" font-family="Segoe UI, Arial, sans-serif" font-weight="700">但它是机器本地的，不跨机同步。</text>

  <rect x="424" y="158" width="366" height="430" rx="20" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
  <text x="448" y="194" fill="#0F172A" font-size="17" font-family="Segoe UI, Arial, sans-serif" font-weight="700">MEMORY.md 的加载窗口</text>

  <rect x="448" y="212" width="318" height="204" rx="12" fill="#DCFCE7" stroke="#22C55E" stroke-width="2.5"/>
  <text x="466" y="238" fill="#15803D" font-size="15" font-family="Segoe UI, Arial, sans-serif" font-weight="700">前 200 行 / 25KB</text>
  <text x="466" y="260" fill="#166534" font-size="13" font-family="Segoe UI, Arial, sans-serif">每次会话启动时被加载</text>
  <path d="M466 272 L 748 272" stroke="#86EFAC" stroke-width="1.5"/>
  <text x="466" y="294" fill="#166534" font-size="11" font-family="Consolas, monospace"># Memory Index</text>
  <text x="466" y="316" fill="#166534" font-size="11" font-family="Consolas, monospace">- [rigor bar](rigor-bar.md) — 实验必须钉住…</text>
  <text x="466" y="338" fill="#166534" font-size="11" font-family="Consolas, monospace">- [verify first](verify.md) — 全量跑之前先…</text>
  <text x="466" y="360" fill="#166534" font-size="11" font-family="Consolas, monospace">- [topology](topology.md) — 三个 git 位置…</text>
  <text x="466" y="382" fill="#166534" font-size="11" font-family="Consolas, monospace">- [profile](profile.md) — 用户偏好与背景…</text>
  <text x="466" y="404" fill="#15803D" font-size="11" font-family="Segoe UI, Arial, sans-serif" font-weight="700">一条一行，只留「去哪找 + 一句钩子」</text>

  <path d="M448 428 L 766 428" stroke="#94A3B8" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="448" y="448" fill="#64748B" font-size="12" font-family="Segoe UI, Arial, sans-serif" font-weight="700">↑ 加载边界</text>

  <rect x="448" y="460" width="318" height="102" rx="12" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="466" y="486" fill="#64748B" font-size="15" font-family="Segoe UI, Arial, sans-serif" font-weight="700">超出限额的部分</text>
  <text x="466" y="510" fill="#64748B" font-size="13" font-family="Segoe UI, Arial, sans-serif">下次加载时被静默丢弃</text>
  <text x="466" y="536" fill="#B91C1C" font-size="13" font-family="Segoe UI, Arial, sans-serif" font-weight="700">静默 = 你不会收到任何提示</text>

  <path d="M772 314 L 800 314" stroke="#7C3AED" stroke-width="2"/>
  <polygon points="800,308 812,314 800,320" fill="#7C3AED"/>
  <text x="784" y="300" fill="#7C3AED" font-size="12" font-family="Segoe UI, Arial, sans-serif" font-weight="700">Read</text>

  <rect x="820" y="158" width="310" height="430" rx="20" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
  <text x="844" y="194" fill="#0F172A" font-size="17" font-family="Segoe UI, Arial, sans-serif" font-weight="700">主题文件：启动时一律不加载</text>

  <rect x="844" y="212" width="262" height="72" rx="12" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
  <text x="862" y="240" fill="#7C3AED" font-size="14" font-family="Consolas, monospace" font-weight="700">debugging.md</text>
  <text x="862" y="264" fill="#6D28D9" font-size="13" font-family="Segoe UI, Arial, sans-serif">这个仓库踩过的调试坑</text>

  <rect x="844" y="296" width="262" height="72" rx="12" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
  <text x="862" y="324" fill="#7C3AED" font-size="14" font-family="Consolas, monospace" font-weight="700">api-conventions.md</text>
  <text x="862" y="348" fill="#6D28D9" font-size="13" font-family="Segoe UI, Arial, sans-serif">接口设计上定过的决策</text>

  <rect x="844" y="380" width="262" height="72" rx="12" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
  <text x="862" y="408" fill="#7C3AED" font-size="14" font-family="Consolas, monospace" font-weight="700">repo-topology.md</text>
  <text x="862" y="432" fill="#6D28D9" font-size="13" font-family="Segoe UI, Arial, sans-serif">哪个目录能公开、哪个不能</text>

  <rect x="844" y="470" width="262" height="92" rx="14" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1.5"/>
  <text x="862" y="496" fill="#1D4ED8" font-size="14" font-family="Segoe UI, Arial, sans-serif" font-weight="700">索引负责「知道去哪找」</text>
  <text x="862" y="520" fill="#1E40AF" font-size="14" font-family="Segoe UI, Arial, sans-serif" font-weight="700">主题文件负责「细节」</text>
  <text x="862" y="548" fill="#1E40AF" font-size="13" font-family="Segoe UI, Arial, sans-serif">典型的渐进式披露结构</text>
</svg>
