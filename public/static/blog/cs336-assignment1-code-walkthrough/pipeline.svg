<text x="42" y="59" font-family="Inter, 'PingFang SC', 'Microsoft YaHei', Arial, sans-serif" font-size="31" font-weight="700" fill="#0f172a" text-anchor="start">从文本到模型，再到新文本</text><text x="42" y="95" font-family="Inter, 'PingFang SC', 'Microsoft YaHei', Arial, sans-serif" font-size="21" font-weight="400" fill="#475569" text-anchor="start">离线准备、训练、生成共用同一套分词规则与模型结构</text><rect x="30" y="126" width="940" height="180" rx="16" fill="#ecfdf5" stroke="none" stroke-width="1.5"/><text x="52" y="165" font-family="Inter, 'PingFang SC', 'Microsoft YaHei', Arial, sans-serif" font-size="23" font-weight="650" fill="#047857" text-anchor="start">01  离线准备</text><rect x="30" y="330" width="940" height="214" rx="16" fill="#eef2ff" stroke="none" stroke-width="1.5"/><text x="52" y="369" font-family="Inter, 'PingFang SC', 'Microsoft YaHei', Arial, sans-serif" font-size="23" font-weight="650" fill="#4338ca" text-anchor="start">02  训练循环</text><rect x="30" y="568" width="940" height="178" rx="16" fill="#fff7ed" stroke="none" stroke-width="1.5"/><text x="52" y="607" font-family="Inter, 'PingFang SC', 'Microsoft YaHei', Arial, sans-serif" font-size="23" font-weight="650" fill="#c2410c" text-anchor="start">03  自回归生成</text><rect x="54" y="191" width="264" height="82" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="72" y="225" font-family="Inter, 'PingFang SC', 'Microsoft YaHei', Arial, sans-serif" font-size="25" font-weight="600" fill="#0f172a" text-anchor="start">原始文本</text><text x="72" y="254" font-family="Inter, 'PingFang SC', 'Microsoft YaHei', Arial, sans-serif" font-size="19" font-weight="400" fill="#475569" text-anchor="start">语料文件</text><rect x="367" y="191" width="264" height="82" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="385" y="225" font-family="Inter, 'PingFang SC', 'Microsoft YaHei', Arial, sans-serif" font-size="25" font-weight="600" fill="#0f172a" text-anchor="start">BPE 编码</text><text x="385" y="254" font-family="'SFMono-Regular', Menlo, Consolas, monospace" font-size="19" font-weight="400" fill="#475569" text-anchor="start">tokenizer.py</text><rect x="680" y="191" width="264" height="82" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="698" y="225" font-family="Inter, 'PingFang SC', 'Microsoft YaHei', Arial, sans-serif" font-size="25" font-weight="600" fill="#0f172a" text-anchor="start">token 文件</text><text x="698" y="254" font-family="Inter, 'PingFang SC', 'Microsoft YaHei', Arial, sans-serif" font-size="19" font-weight="400" fill="#475569" text-anchor="start">uint16 / .bin</text><path d="M320 232 L357 232" stroke="#64748b" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M633 232 L670 232" stroke="#64748b" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M812 273 V318 H330 V383 H186 V388" stroke="#64748b" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="54" y="396" width="264" height="82" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="72" y="430" font-family="Inter, 'PingFang SC', 'Microsoft YaHei', Arial, sans-serif" font-size="24" font-weight="600" fill="#0f172a" text-anchor="start">采样 x、y</text><text x="72" y="459" font-family="'SFMono-Regular', Menlo, Consolas, monospace" font-size="17" font-weight="400" fill="#475569" text-anchor="start">data.py</text><rect x="367" y="396" width="264" height="82" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="385" y="430" font-family="Inter, 'PingFang SC', 'Microsoft YaHei', Arial, sans-serif" font-size="24" font-weight="600" fill="#0f172a" text-anchor="start">Transformer</text><text x="385" y="459" font-family="'SFMono-Regular', Menlo, Consolas, monospace" font-size="17" font-weight="400" fill="#475569" text-anchor="start">model.py</text><rect x="680" y="396" width="264" height="82" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="698" y="430" font-family="Inter, 'PingFang SC', 'Microsoft YaHei', Arial, sans-serif" font-size="24" font-weight="600" fill="#0f172a" text-anchor="start">损失与参数更新</text><text x="698" y="459" font-family="'SFMono-Regular', Menlo, Consolas, monospace" font-size="17" font-weight="400" fill="#475569" text-anchor="start">nn_utils / optimizer</text><path d="M320 437 L357 437" stroke="#64748b" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M633 437 L670 437" stroke="#64748b" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><text x="54" y="518" font-family="Inter, 'PingFang SC', 'Microsoft YaHei', Arial, sans-serif" font-size="20" font-weight="400" fill="#4338ca" text-anchor="start">train.py 反复组织：采样 → 前向 → 反向 → 更新；checkpointing.py 保存状态</text><path d="M500 546 L500 624" stroke="#64748b" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="54" y="632" width="264" height="82" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="72" y="666" font-family="Inter, 'PingFang SC', 'Microsoft YaHei', Arial, sans-serif" font-size="23" font-weight="600" fill="#0f172a" text-anchor="start">提示词编码</text><text x="72" y="695" font-family="Inter, 'PingFang SC', 'Microsoft YaHei', Arial, sans-serif" font-size="19" font-weight="400" fill="#475569" text-anchor="start">使用相同词表</text><rect x="367" y="632" width="264" height="82" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="385" y="666" font-family="Inter, 'PingFang SC', 'Microsoft YaHei', Arial, sans-serif" font-size="23" font-weight="600" fill="#0f172a" text-anchor="start">载入模型检查点</text><text x="385" y="695" font-family="Inter, 'PingFang SC', 'Microsoft YaHei', Arial, sans-serif" font-size="19" font-weight="400" fill="#475569" text-anchor="start">config + 权重</text><rect x="680" y="632" width="264" height="82" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="698" y="666" font-family="Inter, 'PingFang SC', 'Microsoft YaHei', Arial, sans-serif" font-size="23" font-weight="600" fill="#0f172a" text-anchor="start">逐个采样新 token</text><text x="698" y="695" font-family="Inter, 'PingFang SC', 'Microsoft YaHei', Arial, sans-serif" font-size="19" font-weight="400" fill="#475569" text-anchor="start">decoding.py</text><path d="M320 673 L357 673" stroke="#64748b" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M633 673 L670 673" stroke="#64748b" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
