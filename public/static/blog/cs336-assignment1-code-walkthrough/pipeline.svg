<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="776" viewBox="0 0 1000 776" role="img" aria-labelledby="title desc">
<title id="title">作业一代码全流程</title><desc id="desc">上方是离线分词，中间是训练采样、模型和参数更新，下方是载入权重后自回归生成。</desc>
