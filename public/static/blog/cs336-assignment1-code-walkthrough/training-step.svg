<svg xmlns="http://www.w3.org/2000/svg" width="880" height="762" viewBox="0 0 880 762" role="img" aria-labelledby="title desc">
<title id="title">梯度累积与一次参数更新</title><desc id="desc">先设置学习率并清理旧梯度，再依次计算四个微批的 loss 除以四并反向传播，最后统一裁剪并执行一次 AdamW 更新。</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#64748b"/></marker></defs>
<rect width="880" height="762" rx="24" fill="#f8fafc"/>
<text x="38" y="57" font-family="Inter, 'PingFang SC', 'Microsoft YaHei', Arial, sans-serif" font-size="29" font-weight="700" fill="#0f172a" text-anchor="start">一个 step：多个微批，一次参数更新</text><text x="38" y="94" font-family="Inter, 'PingFang SC', 'Microsoft YaHei', Arial, sans-serif" font-size="22" font-weight="400" fill="#475569" text-anchor="start">示例：有效批大小 32 = 微批大小 8 × 累积 4 次</text><rect x="38" y="130" width="804" height="74" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="63" y="176" font-family="Inter, 'PingFang SC', 'Microsoft YaHei', Arial, sans-serif" font-size="25" font-weight="600" fill="#0f172a" text-anchor="start">设置学习率 → zero_grad(set_to_none=True)</text><path d="M440 206 L440 226" stroke="#64748b" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="38" y="234" width="804" height="232" rx="16" fill="#eef2ff" stroke="#a5b4fc" stroke-width="1.5"/><text x="62" y="274" font-family="Inter, 'PingFang SC', 'Microsoft YaHei', Arial, sans-serif" font-size="23" font-weight="650" fill="#4338ca" text-anchor="start">重复 4 次；期间参数保持不变，梯度不断累加</text><rect x="62" y="298" width="173" height="133" rx="16" fill="#ffffff" stroke="#c7d2fe" stroke-width="1.5"/><text x="148" y="333" font-family="Inter, 'PingFang SC', 'Microsoft YaHei', Arial, sans-serif" font-size="23" font-weight="600" fill="#0f172a" text-anchor="middle">微批 1</text><text x="148" y="370" font-family="Inter, 'PingFang SC', 'Microsoft YaHei', Arial, sans-serif" font-size="18" font-weight="400" fill="#475569" text-anchor="middle">前向 → loss / 4</text><text x="148" y="405" font-family="'SFMono-Regular', Menlo, Consolas, monospace" font-size="20" font-weight="600" fill="#4338ca" text-anchor="middle">backward()</text><rect x="257" y="298" width="173" height="133" rx="16" fill="#ffffff" stroke="#c7d2fe" stroke-width="1.5"/><text x="343" y="333" font-family="Inter, 'PingFang SC', 'Microsoft YaHei', Arial, sans-serif" font-size="23" font-weight="600" fill="#0f172a" text-anchor="middle">微批 2</text><text x="343" y="370" font-family="Inter, 'PingFang SC', 'Microsoft YaHei', Arial, sans-serif" font-size="18" font-weight="400" fill="#475569" text-anchor="middle">前向 → loss / 4</text><text x="343" y="405" font-family="'SFMono-Regular', Menlo, Consolas, monospace" font-size="20" font-weight="600" fill="#4338ca" text-anchor="middle">backward()</text><rect x="452" y="298" width="173" height="133" rx="16" fill="#ffffff" stroke="#c7d2fe" stroke-width="1.5"/><text x="538" y="333" font-family="Inter, 'PingFang SC', 'Microsoft YaHei', Arial, sans-serif" font-size="23" font-weight="600" fill="#0f172a" text-anchor="middle">微批 3</text><text x="538" y="370" font-family="Inter, 'PingFang SC', 'Microsoft YaHei', Arial, sans-serif" font-size="18" font-weight="400" fill="#475569" text-anchor="middle">前向 → loss / 4</text><text x="538" y="405" font-family="'SFMono-Regular', Menlo, Consolas, monospace" font-size="20" font-weight="600" fill="#4338ca" text-anchor="middle">backward()</text><rect x="647" y="298" width="173" height="133" rx="16" fill="#ffffff" stroke="#c7d2fe" stroke-width="1.5"/><text x="733" y="333" font-family="Inter, 'PingFang SC', 'Microsoft YaHei', Arial, sans-serif" font-size="23" font-weight="600" fill="#0f172a" text-anchor="middle">微批 4</text><text x="733" y="370" font-family="Inter, 'PingFang SC', 'Microsoft YaHei', Arial, sans-serif" font-size="18" font-weight="400" fill="#475569" text-anchor="middle">前向 → loss / 4</text><text x="733" y="405" font-family="'SFMono-Regular', Menlo, Consolas, monospace" font-size="20" font-weight="600" fill="#4338ca" text-anchor="middle">backward()</text><path d="M440 468 L440 491" stroke="#64748b" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="38" y="500" width="804" height="73" rx="16" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1.5"/><text x="63" y="545" font-family="Inter, 'PingFang SC', 'Microsoft YaHei', Arial, sans-serif" font-size="22" font-weight="600" fill="#047857" text-anchor="start">统一裁剪：clip_gradients(model.parameters(), ...)</text><path d="M440 575 L440 598" stroke="#64748b" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="38" y="607" width="804" height="73" rx="16" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.5"/><text x="63" y="652" font-family="Inter, 'PingFang SC', 'Microsoft YaHei', Arial, sans-serif" font-size="24" font-weight="600" fill="#9a3412" text-anchor="start">更新一次：optimizer.step() → 参数、m、v、t</text><text x="38" y="725" font-family="Inter, 'PingFang SC', 'Microsoft YaHei', Arial, sans-serif" font-size="21" font-weight="400" fill="#475569" text-anchor="start">裁剪发生在全部梯度累积之后；下一步更新前再清理旧梯度。</text>
</svg>