<svg xmlns="http://www.w3.org/2000/svg" width="940" height="723" viewBox="0 0 940 723" role="img" aria-labelledby="title desc">
<title id="title">多头注意力形状与因果掩码</title><desc id="desc">Q、K、V 拆成多头；注意力分数为 B H T T。行是 query、列是 key，含对角线的下三角为 True，允许关注。</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#64748b"/></marker></defs>
<rect width="940" height="723" rx="24" fill="#f8fafc"/>
<text x="38" y="57" font-family="Inter, 'PingFang SC', 'Microsoft YaHei', Arial, sans-serif" font-size="30" font-weight="700" fill="#0f172a" text-anchor="start">多头注意力：形状与因果掩码</text><text x="38" y="93" font-family="Inter, 'PingFang SC', 'Microsoft YaHei', Arial, sans-serif" font-size="21" font-weight="400" fill="#475569" text-anchor="start">示例 B=2，T=4，D=8，H=2，每头维度 dₕ=4</text><rect x="38" y="128" width="453" height="81" rx="16" fill="#ecfdf5" stroke="#cbd5e1" stroke-width="1.5"/><text x="56" y="161" font-family="Inter, 'PingFang SC', 'Microsoft YaHei', Arial, sans-serif" font-size="23" font-weight="600" fill="#0f172a" text-anchor="start">投影得到 Q / K / V</text><text x="56" y="190" font-family="Inter, 'PingFang SC', 'Microsoft YaHei', Arial, sans-serif" font-size="20" font-weight="400" fill="#475569" text-anchor="start">(B, T, D) = (2, 4, 8)</text><path d="M264 211 L264 229" stroke="#64748b" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="38" y="233" width="453" height="81" rx="16" fill="#eef2ff" stroke="#cbd5e1" stroke-width="1.5"/><text x="56" y="266" font-family="Inter, 'PingFang SC', 'Microsoft YaHei', Arial, sans-serif" font-size="23" font-weight="600" fill="#0f172a" text-anchor="start">拆头 + RoPE（仅 Q、K）</text><text x="56" y="295" font-family="Inter, 'PingFang SC', 'Microsoft YaHei', Arial, sans-serif" font-size="20" font-weight="400" fill="#475569" text-anchor="start">(B, H, T, dₕ) = (2, 2, 4, 4)</text><path d="M264 316 L264 334" stroke="#64748b" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="38" y="338" width="453" height="81" rx="16" fill="#fff7ed" stroke="#cbd5e1" stroke-width="1.5"/><text x="56" y="371" font-family="Inter, 'PingFang SC', 'Microsoft YaHei', Arial, sans-serif" font-size="23" font-weight="600" fill="#0f172a" text-anchor="start">QKᵀ / √dₕ + mask</text><text x="56" y="400" font-family="Inter, 'PingFang SC', 'Microsoft YaHei', Arial, sans-serif" font-size="20" font-weight="400" fill="#475569" text-anchor="start">(B, H, T, T) = (2, 2, 4, 4)</text><path d="M264 421 L264 439" stroke="#64748b" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="38" y="443" width="453" height="81" rx="16" fill="#eef2ff" stroke="#cbd5e1" stroke-width="1.5"/><text x="56" y="476" font-family="Inter, 'PingFang SC', 'Microsoft YaHei', Arial, sans-serif" font-size="23" font-weight="600" fill="#0f172a" text-anchor="start">softmax → 加权 V</text><text x="56" y="505" font-family="Inter, 'PingFang SC', 'Microsoft YaHei', Arial, sans-serif" font-size="20" font-weight="400" fill="#475569" text-anchor="start">(B, H, T, dₕ) = (2, 2, 4, 4)</text><path d="M264 526 L264 544" stroke="#64748b" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="38" y="548" width="453" height="81" rx="16" fill="#ecfdf5" stroke="#cbd5e1" stroke-width="1.5"/><text x="56" y="581" font-family="Inter, 'PingFang SC', 'Microsoft YaHei', Arial, sans-serif" font-size="23" font-weight="600" fill="#0f172a" text-anchor="start">拼头 + 输出投影</text><text x="56" y="610" font-family="Inter, 'PingFang SC', 'Microsoft YaHei', Arial, sans-serif" font-size="20" font-weight="400" fill="#475569" text-anchor="start">(B, T, D) = (2, 4, 8)</text><text x="550" y="171" font-family="Inter, 'PingFang SC', 'Microsoft YaHei', Arial, sans-serif" font-size="24" font-weight="650" fill="#0f172a" text-anchor="start">每个头使用同一张掩码</text><text x="550" y="210" font-family="Inter, 'PingFang SC', 'Microsoft YaHei', Arial, sans-serif" font-size="21" font-weight="400" fill="#475569" text-anchor="start">列 = key 位置</text><text x="636.5" y="238" font-family="Inter, 'PingFang SC', 'Microsoft YaHei', Arial, sans-serif" font-size="23" font-weight="500" fill="#475569" text-anchor="middle">0</text><text x="701.5" y="238" font-family="Inter, 'PingFang SC', 'Microsoft YaHei', Arial, sans-serif" font-size="23" font-weight="500" fill="#475569" text-anchor="middle">1</text><text x="766.5" y="238" font-family="Inter, 'PingFang SC', 'Microsoft YaHei', Arial, sans-serif" font-size="23" font-weight="500" fill="#475569" text-anchor="middle">2</text><text x="831.5" y="238" font-family="Inter, 'PingFang SC', 'Microsoft YaHei', Arial, sans-serif" font-size="23" font-weight="500" fill="#475569" text-anchor="middle">3</text><text x="580" y="296" font-family="Inter, 'PingFang SC', 'Microsoft YaHei', Arial, sans-serif" font-size="23" font-weight="500" fill="#475569" text-anchor="middle">0</text><rect x="604" y="254" width="61" height="61" rx="8" fill="#d1fae5" stroke="none" stroke-width="1.5"/><text x="634.5" y="293" font-family="'SFMono-Regular', Menlo, Consolas, monospace" font-size="25" font-weight="600" fill="#047857" text-anchor="middle">T</text><rect x="669" y="254" width="61" height="61" rx="8" fill="#e2e8f0" stroke="none" stroke-width="1.5"/><text x="699.5" y="293" font-family="'SFMono-Regular', Menlo, Consolas, monospace" font-size="25" font-weight="600" fill="#94a3b8" text-anchor="middle">F</text><rect x="734" y="254" width="61" height="61" rx="8" fill="#e2e8f0" stroke="none" stroke-width="1.5"/><text x="764.5" y="293" font-family="'SFMono-Regular', Menlo, Consolas, monospace" font-size="25" font-weight="600" fill="#94a3b8" text-anchor="middle">F</text><rect x="799" y="254" width="61" height="61" rx="8" fill="#e2e8f0" stroke="none" stroke-width="1.5"/><text x="829.5" y="293" font-family="'SFMono-Regular', Menlo, Consolas, monospace" font-size="25" font-weight="600" fill="#94a3b8" text-anchor="middle">F</text><text x="580" y="361" font-family="Inter, 'PingFang SC', 'Microsoft YaHei', Arial, sans-serif" font-size="23" font-weight="500" fill="#475569" text-anchor="middle">1</text><rect x="604" y="319" width="61" height="61" rx="8" fill="#d1fae5" stroke="none" stroke-width="1.5"/><text x="634.5" y="358" font-family="'SFMono-Regular', Menlo, Consolas, monospace" font-size="25" font-weight="600" fill="#047857" text-anchor="middle">T</text><rect x="669" y="319" width="61" height="61" rx="8" fill="#d1fae5" stroke="none" stroke-width="1.5"/><text x="699.5" y="358" font-family="'SFMono-Regular', Menlo, Consolas, monospace" font-size="25" font-weight="600" fill="#047857" text-anchor="middle">T</text><rect x="734" y="319" width="61" height="61" rx="8" fill="#e2e8f0" stroke="none" stroke-width="1.5"/><text x="764.5" y="358" font-family="'SFMono-Regular', Menlo, Consolas, monospace" font-size="25" font-weight="600" fill="#94a3b8" text-anchor="middle">F</text><rect x="799" y="319" width="61" height="61" rx="8" fill="#e2e8f0" stroke="none" stroke-width="1.5"/><text x="829.5" y="358" font-family="'SFMono-Regular', Menlo, Consolas, monospace" font-size="25" font-weight="600" fill="#94a3b8" text-anchor="middle">F</text><text x="580" y="426" font-family="Inter, 'PingFang SC', 'Microsoft YaHei', Arial, sans-serif" font-size="23" font-weight="500" fill="#475569" text-anchor="middle">2</text><rect x="604" y="384" width="61" height="61" rx="8" fill="#d1fae5" stroke="none" stroke-width="1.5"/><text x="634.5" y="423" font-family="'SFMono-Regular', Menlo, Consolas, monospace" font-size="25" font-weight="600" fill="#047857" text-anchor="middle">T</text><rect x="669" y="384" width="61" height="61" rx="8" fill="#d1fae5" stroke="none" stroke-width="1.5"/><text x="699.5" y="423" font-family="'SFMono-Regular', Menlo, Consolas, monospace" font-size="25" font-weight="600" fill="#047857" text-anchor="middle">T</text><rect x="734" y="384" width="61" height="61" rx="8" fill="#d1fae5" stroke="none" stroke-width="1.5"/><text x="764.5" y="423" font-family="'SFMono-Regular', Menlo, Consolas, monospace" font-size="25" font-weight="600" fill="#047857" text-anchor="middle">T</text><rect x="799" y="384" width="61" height="61" rx="8" fill="#e2e8f0" stroke="none" stroke-width="1.5"/><text x="829.5" y="423" font-family="'SFMono-Regular', Menlo, Consolas, monospace" font-size="25" font-weight="600" fill="#94a3b8" text-anchor="middle">F</text><text x="580" y="491" font-family="Inter, 'PingFang SC', 'Microsoft YaHei', Arial, sans-serif" font-size="23" font-weight="500" fill="#475569" text-anchor="middle">3</text><rect x="604" y="449" width="61" height="61" rx="8" fill="#d1fae5" stroke="none" stroke-width="1.5"/><text x="634.5" y="488" font-family="'SFMono-Regular', Menlo, Consolas, monospace" font-size="25" font-weight="600" fill="#047857" text-anchor="middle">T</text><rect x="669" y="449" width="61" height="61" rx="8" fill="#d1fae5" stroke="none" stroke-width="1.5"/><text x="699.5" y="488" font-family="'SFMono-Regular', Menlo, Consolas, monospace" font-size="25" font-weight="600" fill="#047857" text-anchor="middle">T</text><rect x="734" y="449" width="61" height="61" rx="8" fill="#d1fae5" stroke="none" stroke-width="1.5"/><text x="764.5" y="488" font-family="'SFMono-Regular', Menlo, Consolas, monospace" font-size="25" font-weight="600" fill="#047857" text-anchor="middle">T</text><rect x="799" y="449" width="61" height="61" rx="8" fill="#d1fae5" stroke="none" stroke-width="1.5"/><text x="829.5" y="488" font-family="'SFMono-Regular', Menlo, Consolas, monospace" font-size="25" font-weight="600" fill="#047857" text-anchor="middle">T</text><text x="550" y="551" font-family="Inter, 'PingFang SC', 'Microsoft YaHei', Arial, sans-serif" font-size="21" font-weight="400" fill="#475569" text-anchor="start">行 = query 位置</text><text x="550" y="590" font-family="Inter, 'PingFang SC', 'Microsoft YaHei', Arial, sans-serif" font-size="22" font-weight="600" fill="#047857" text-anchor="start">True：允许关注（j ≤ i）</text><text x="550" y="626" font-family="Inter, 'PingFang SC', 'Microsoft YaHei', Arial, sans-serif" font-size="22" font-weight="400" fill="#475569" text-anchor="start">False：softmax 前填 −∞</text><text x="38" y="686" font-family="Inter, 'PingFang SC', 'Microsoft YaHei', Arial, sans-serif" font-size="21" font-weight="400" fill="#475569" text-anchor="start">每一行对 key 维归一化；每个位置只能汇聚自己和前面位置的信息。</text>
</svg>